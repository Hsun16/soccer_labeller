# ── data ──
data_path: shots.csv
features:
  - distance
  - angle
  - header
  - penalty
  - free_kick
  - under_pressure
  - n_def_in_cone
  - gk_dist_to_goal
target: goal
test_size: 0.2
val_size: 0.25          # fraction of train set used for validation
seed: 42

# ── architecture ──
hidden_layers: [128, 64, 32]
dropout_rates: [0.30, 0.20, 0.0]   # one per hidden layer
use_batchnorm: true

# ── training ──
batch_size: 256
epochs: 500
lr: 0.001
weight_decay: 0.0001
patience: 30            # early stopping patience (epochs)
lr_patience: 10         # scheduler patience (epochs)
lr_factor: 0.5          # scheduler LR reduction factor
pos_weight: 1.0         # has to be a float

# ── output ──
save_path: xg_model.pt
print_every: 20
